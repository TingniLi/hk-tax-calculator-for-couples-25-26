<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港25/26年度夫妻薪俸税优化计算器</title>
    <style>
        :root { --primary-color: #0056b3; --bg-color: #f4f7f6; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-color); color: #333; line-height: 1.6; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: var(--primary-color); font-size: 24px; }
        h2 { border-bottom: 2px solid #eaeaea; padding-bottom: 5px; font-size: 18px; margin-top: 30px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: #fafafa; padding: 20px; border-radius: 8px; border: 1px solid #ddd; }
        label { display: block; margin-bottom: 8px; font-weight: 500; }
        input[type="number"], select { width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: var(--primary-color); color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; width: 100%; transition: 0.3s; }
        button:hover { background-color: #004494; }
        .result-box { margin-top: 20px; padding: 15px; border-radius: 5px; display: none; }
        .success { background-color: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .info { background-color: #e2e3e5; border: 1px solid #d6d8db; color: #383d41; }
        .warning { background-color: #fff3cd; border: 1px solid #ffeeba; color: #856404; }
        .privacy-note { font-size: 12px; color: #666; text-align: center; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>香港25/26年度夫妻薪俸税分配优化器</h1>
    <p style="text-align: center; font-size: 14px; color: #666;">基于2025/26年度财政预算案税率与宽减（上限$3,000）</p>

    <h2>1. 个人基础数据 (不可分配项目)</h2>
    <div class="grid-2">
        <div class="card">
            <h3 style="margin-top: 0; color: #444;">丈夫</h3>
            <label>全年薪俸总收入 (HK$):</label>
            <input type="number" id="incH" value="0" min="0">
            <label>专属扣除 (如强积金最高1.8万/进修等):</label>
            <input type="number" id="dedH" value="0" min="0">
        </div>
        <div class="card">
            <h3 style="margin-top: 0; color: #444;">妻子</h3>
            <label>全年薪俸总收入 (HK$):</label>
            <input type="number" id="incW" value="0" min="0">
            <label>专属扣除 (如强积金最高1.8万/进修等):</label>
            <input type="number" id="dedW" value="0" min="0">
        </div>
    </div>

    <h2>2. 家庭可分配额度 (由系统寻找最佳分配)</h2>
    <div class="card">
        <label>供养子女人数 (每名子女免税额$130,000):</label>
        <input type="number" id="children" value="0" min="0">
        <label>可分配住宅租金扣除总计 (上限通常为$100,000):</label>
        <input type="number" id="rentTotal" value="0" min="0">
        <label>其他可分配扣除总计 (如长者照顾/房贷利息等):</label>
        <input type="number" id="otherTotal" value="0" min="0">
        <button onclick="generateBestAllocation()">生成最佳分配模式</button>
    </div>
    <div id="sysResult" class="result-box success"></div>

    <h2>3. 验证自定义分配模式</h2>
    <div class="card">
        <label>是否合并评税:</label>
        <select id="customJoint">
            <option value="false">分开评税</option>
            <option value="true">合并评税</option>
        </select>
        <label>子女免税额归属:</label>
        <select id="customChild">
            <option value="H">全部归丈夫</option>
            <option value="W">全部归妻子</option>
        </select>
        <div class="grid-2">
            <div>
                <label>丈夫分担租金扣除:</label>
                <input type="number" id="customRentH" value="0" min="0">
            </div>
            <div>
                <label>妻子分担租金扣除 (自动计算):</label>
                <input type="number" id="customRentW" value="0" min="0" readonly style="background:#eee;">
            </div>
        </div>
        <div class="grid-2">
            <div>
                <label>丈夫分担其他扣除:</label>
                <input type="number" id="customOtherH" value="0" min="0">
            </div>
            <div>
                <label>妻子分担其他扣除 (自动计算):</label>
                <input type="number" id="customOtherW" value="0" min="0" readonly style="background:#eee;">
            </div>
        </div>
        <button style="background-color: #28a745;" onclick="verifyCustomAllocation()">验证是否为最佳模式</button>
    </div>
    <div id="verifyResult" class="result-box info"></div>
    
    <p class="privacy-note">🔒 安全声明：所有计算均在您的浏览器本地进行，数据不会上传至任何服务器。</p>
</div>

<script>
    const TAX_REDUCTION_CAP = 3000;
    const BASIC_ALLOWANCE = 132000;
    const MARRIED_ALLOWANCE = 264000;
    const CHILD_ALLOWANCE_PER_KID = 130000;
    let minTaxGlobal = null; 

    // 计算个人的税款 (25/26年度)
    function calculateSingleTax(netTotalIncome, totalAllowances) {
        if (netTotalIncome <= 0) return 0;
        
        // 标准税率计算 (以净入息计算，不扣减免税额)
        let standardTax = netTotalIncome <= 5000000 
            ? netTotalIncome * 0.15 
            : (5000000 * 0.15 + (netTotalIncome - 5000000) * 0.16);
            
        // 累进税率计算 (扣减免税额后)
        let netChargeableIncome = netTotalIncome - totalAllowances;
        let progressiveTax = 0;
        if (netChargeableIncome > 0) {
            let nci = netChargeableIncome;
            if (nci <= 50000) progressiveTax = nci * 0.02;
            else if (nci <= 100000) progressiveTax = 1000 + (nci - 50000) * 0.06;
            else if (nci <= 150000) progressiveTax = 4000 + (nci - 100000) * 0.10;
            else if (nci <= 200000) progressiveTax = 9000 + (nci - 150000) * 0.14;
            else progressiveTax = 16000 + (nci - 200000) * 0.17;
        }
        
        let baseTax = Math.min(standardTax, progressiveTax);
        return Math.max(0, baseTax - TAX_REDUCTION_CAP); // 宽减上限
    }

    // 搜索最佳分配算法
    function generateBestAllocation() {
        let incH = Number(document.getElementById('incH').value) || 0;
        let dedH = Number(document.getElementById('dedH').value) || 0;
        let incW = Number(document.getElementById('incW').value) || 0;
        let dedW = Number(document.getElementById('dedW').value) || 0;
        
        let childrenCount = Number(document.getElementById('children').value) || 0;
        let rentTotal = Number(document.getElementById('rentTotal').value) || 0;
        let otherTotal = Number(document.getElementById('otherTotal').value) || 0;
        
        let totalChildAllowance = childrenCount * CHILD_ALLOWANCE_PER_KID;
        
        let minTax = Infinity;
        let bestConfig = null;

        let stepRent = rentTotal > 10000 ? 1000 : (rentTotal > 0 ? 500 : 1000);
        let stepOther = otherTotal > 10000 ? 1000 : (otherTotal > 0 ? 500 : 1000);

        // 暴力穷举分配（JS 在浏览器端执行百万次运算只需几毫秒，这里步长通常只有百次循环）
        for (let childToH of [true, false]) {
            for (let rentH = 0; rentH <= rentTotal; rentH += stepRent) {
                if(rentH > rentTotal) rentH = rentTotal; 
                let rentW = rentTotal - rentH;
                
                for (let otherH = 0; otherH <= otherTotal; otherH += stepOther) {
                    if(otherH > otherTotal) otherH = otherTotal;
                    let otherW = otherTotal - otherH;
                    
                    // 分开评税
                    let ntiH = incH - (dedH + rentH + otherH);
                    let ntiW = incW - (dedW + rentW + otherW);
                    let allowH = BASIC_ALLOWANCE + (childToH ? totalChildAllowance : 0);
                    let allowW = BASIC_ALLOWANCE + (!childToH ? totalChildAllowance : 0);
                    
                    let taxH = calculateSingleTax(ntiH, allowH);
                    let taxW = calculateSingleTax(ntiW, allowW);
                    let sepTaxTotal = taxH + taxW;
                    
                    // 合并评税
                    let ntiJoint = (incH + incW) - (dedH + dedW + rentTotal + otherTotal);
                    let taxJoint = calculateSingleTax(ntiJoint, MARRIED_ALLOWANCE + totalChildAllowance);
                    
                    let currentMin = Math.min(sepTaxTotal, taxJoint);
                    let isJoint = taxJoint < sepTaxTotal;
                    
                    if (currentMin < minTax) {
                        minTax = currentMin;
                        bestConfig = {
                            isJoint: isJoint, childToH: childToH,
                            rentH: rentH, rentW: rentW, otherH: otherH, otherW: otherW,
                            taxH: isJoint ? 0 : taxH, taxW: isJoint ? 0 : taxW, totalTax: currentMin
                        };
                    }
                    if(otherH === otherTotal) break;
                }
                if(rentH === rentTotal) break;
            }
        }

        minTaxGlobal = minTax; // 记录给验证功能使用
        
        let resDiv = document.getElementById('sysResult');
        resDiv.style.display = 'block';
        resDiv.className = 'result-box success';
        resDiv.innerHTML = `
            <strong>🌟 系统推荐最佳方案 (${bestConfig.isJoint ? '合并评税' : '分开评税'}):</strong><br>
            - 子女免税额归属: ${bestConfig.childToH ? '丈夫' : '妻子'}名下<br>
            - 住宅租金扣除: 丈夫填 <b>$${bestConfig.rentH}</b>，妻子填 <b>$${bestConfig.rentW}</b><br>
            - 其他扣除分配: 丈夫填 <b>$${bestConfig.otherH}</b>，妻子填 <b>$${bestConfig.otherW}</b><br><br>
            📊 <strong>预计缴税金额:</strong><br>
            ${bestConfig.isJoint 
                ? `家庭总计需缴税: <b style="color:red; font-size:18px;">$${bestConfig.totalTax.toLocaleString()}</b>`
                : `丈夫需缴: $${bestConfig.taxH.toLocaleString()} | 妻子需缴: $${bestConfig.taxW.toLocaleString()}<br>
                   家庭总计需缴税: <b style="color:red; font-size:18px;">$${bestConfig.totalTax.toLocaleString()}</b>`
            }
        `;
    }

    // 交互辅助：自动计算剩余额度
    document.getElementById('customRentH').addEventListener('input', function() {
        let total = Number(document.getElementById('rentTotal').value) || 0;
        let h = Number(this.value) || 0;
        document.getElementById('customRentW').value = Math.max(0, total - h);
    });
    document.getElementById('customOtherH').addEventListener('input', function() {
        let total = Number(document.getElementById('otherTotal').value) || 0;
        let h = Number(this.value) || 0;
        document.getElementById('customOtherW').value = Math.max(0, total - h);
    });

    // 验证自定义配置
    function verifyCustomAllocation() {
        if (minTaxGlobal === null) {
            alert("请先点击『生成最佳分配模式』以建立系统基准！");
            return;
        }

        let incH = Number(document.getElementById('incH').value) || 0;
        let dedH = Number(document.getElementById('dedH').value) || 0;
        let incW = Number(document.getElementById('incW').value) || 0;
        let dedW = Number(document.getElementById('dedW').value) || 0;
        let childrenCount = Number(document.getElementById('children').value) || 0;
        
        let rentTotal = Number(document.getElementById('rentTotal').value) || 0;
        let otherTotal = Number(document.getElementById('otherTotal').value) || 0;

        let rentH = Number(document.getElementById('customRentH').value) || 0;
        let rentW = Number(document.getElementById('customRentW').value) || 0;
        let otherH = Number(document.getElementById('customOtherH').value) || 0;
        let otherW = Number(document.getElementById('customOtherW').value) || 0;

        if ((rentH + rentW) !== rentTotal || (otherH + otherW) !== otherTotal) {
            alert("错误：您分配的租金或其它扣除额度之和，与第二部分填写的总额不符！");
            return;
        }

        let isJoint = document.getElementById('customJoint').value === "true";
        let childToH = document.getElementById('customChild').value === "H";
        let totalChildAllowance = childrenCount * CHILD_ALLOWANCE_PER_KID;

        let totalTax = 0, taxH = 0, taxW = 0;

        if (isJoint) {
            let ntiJoint = (incH + incW) - (dedH + dedW + rentTotal + otherTotal);
            totalTax = calculateSingleTax(ntiJoint, MARRIED_ALLOWANCE + totalChildAllowance);
        } else {
            let ntiH = incH - (dedH + rentH + otherH);
            let ntiW = incW - (dedW + rentW + otherW);
            taxH = calculateSingleTax(ntiH, BASIC_ALLOWANCE + (childToH ? totalChildAllowance : 0));
            taxW = calculateSingleTax(ntiW, BASIC_ALLOWANCE + (!childToH ? totalChildAllowance : 0));
            totalTax = taxH + taxW;
        }

        let resDiv = document.getElementById('verifyResult');
        resDiv.style.display = 'block';
        
        let isOptimal = Math.abs(totalTax - minTaxGlobal) <= 0.01;
        
        resDiv.className = isOptimal ? 'result-box success' : 'result-box warning';
        
        resDiv.innerHTML = `
            <strong>${isOptimal ? '✅ 恭喜！您选择的方案属于最佳分配组合之一。' : '⚠️ 留意：您选择的方案不是最省税的。'}</strong><br>
            您当前方案的缴税额：<br>
            ${isJoint 
                ? `合并需缴税: $${totalTax.toLocaleString()}`
                : `丈夫需缴: $${taxH.toLocaleString()} | 妻子需缴: $${taxW.toLocaleString()} | <b>总计: $${totalTax.toLocaleString()}</b>`
            }<br>
            <br>
            ${!isOptimal ? `💡 相比系统最佳方案 ($${minTaxGlobal.toLocaleString()})，此方案会让您<b>多缴税 $${(totalTax - minTaxGlobal).toLocaleString()}</b>。` : ''}
        `;
    }
</script>
</body>
</html>
